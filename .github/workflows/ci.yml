name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup V
        uses: vlang/setup-v@v1.4
        env:
          VFLAGS: -no-prealloc
        with:
          check-latest: true

      - name: Verify formatting
        run: v fmt -verify src cmd examples bench tests/public_api_contract_test.v

      - name: Run tests
        run: v test src

      - name: Verify public API from an external module
        run: v test tests/public_api_contract_test.v

      - name: Large-document performance smoke
        run: v run bench/roundtrip.v

      - name: Build CLI
        run: v -o /tmp/vmarkdown cmd/cli

      - name: Smoke CLI
        run: /tmp/vmarkdown ast README.md > /tmp/vmarkdown-ast.txt
